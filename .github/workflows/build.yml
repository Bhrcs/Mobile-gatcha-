# Builds Cinderbound (C++ / Axmol) and checks it.
#  - logic:   engine-free rule tests (g++)
#  - windows: Release build -> Cinderbound_Windows.zip artifact
#  - linux:   Release build + screenshot probe under Xvfb
# Logs and screenshots are pushed to the `ci-logs` branch so they can be read without a login.
name: build
on:
  push:
    branches: [main, cpp-axmol]
  workflow_dispatch:

permissions:
  contents: write

env:
  AXMOL_REF: v2.11.5

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash Tests/run_logic_tests.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: axmolengine/axmol, ref: "${{ env.AXMOL_REF }}", path: axmol }
      - name: Build
        shell: bash
        run: pwsh -c "./axmol/setup.ps1; axmol build -p win32 -t Cinderbound -O 3" 2>&1 | tee build-windows.log
      - name: Package
        shell: pwsh
        run: |
          $dir = "build/bin/Cinderbound/Release"
          if (-not (Test-Path "$dir/Cinderbound.exe")) { throw "Cinderbound.exe was not built" }
          New-Item -ItemType Directory -Force pkg/Cinderbound | Out-Null
          Copy-Item "$dir/*.exe", "$dir/*.dll" pkg/Cinderbound
          # compiled shaders (axslc) must ship next to the exe, or nothing renders (black screen)
          if (Test-Path "$dir/axslc") { Copy-Item -Recurse "$dir/axslc" pkg/Cinderbound/axslc }
          elseif (Test-Path build/runtime/axslc) { Copy-Item -Recurse build/runtime/axslc pkg/Cinderbound/axslc }
          else { throw "compiled shaders (axslc) not found" }
          # VC++ runtime next to the exe so players need no redistributable
          foreach ($d in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (Test-Path "C:/Windows/System32/$d") { Copy-Item "C:/Windows/System32/$d" pkg/Cinderbound -Force }
          }
          Copy-Item -Recurse Content pkg/Cinderbound/Content
          Compress-Archive -Path pkg/Cinderbound -DestinationPath Cinderbound_Windows.zip -Force
      - name: Smoke test (launch from another folder, screenshot the menu)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots-win | Out-Null
          $env:CB_SHOTS = "main_menu,home"
          $env:CB_SHOT_DIR = (Resolve-Path shots-win).Path + "\"
          $log = (Resolve-Path shots-win).Path + "\run.log"
          $p = Start-Process -FilePath (Resolve-Path pkg/Cinderbound/Cinderbound.exe) -WorkingDirectory $env:TEMP -PassThru -RedirectStandardOutput $log -RedirectStandardError ((Resolve-Path shots-win).Path + "\err.log")
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "timed out" }
          Get-ChildItem shots-win
          if (-not (Test-Path shots-win/main_menu.png) -or (Get-Item shots-win/main_menu.png).Length -lt 5000) {
            throw "Windows smoke test: the main menu did not render (black or missing screenshot)"
          }
          # normal double-click style launch (working folder = exe folder): screenshot the desktop, keep the log
          Remove-Item Env:CB_SHOTS, Env:CB_SHOT_DIR
          $exe = Resolve-Path pkg/Cinderbound/Cinderbound.exe
          $q = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Resolve-Path shots-win).Path + "\desktop.png")
          $alive = -not $q.HasExited
          if ($alive) { $q.Kill() }
          Copy-Item pkg/Cinderbound/Cinderbound.log shots-win/normal-run.log -ErrorAction SilentlyContinue
          Remove-Item pkg/Cinderbound/Cinderbound.log -ErrorAction SilentlyContinue
          if (-not $alive) { throw "Windows smoke test: the game closed on a normal launch" }
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: Cinderbound_Windows, path: Cinderbound_Windows.zip }
      - name: Publish pre-release
        if: success() && github.ref == 'refs/heads/cpp-axmol'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cpp-latest
          name: Cinderbound C++ (latest build)
          prerelease: true
          body: "Automatic Windows build of the C++ / Axmol version (branch cpp-axmol, commit ${{ github.sha }}). Unzip and run Cinderbound.exe."
          files: Cinderbound_Windows.zip
      - name: Publish log
        if: always()
        shell: bash
        run: |
          mkdir -p out && cp build-windows.log out/ 2>/dev/null || echo "no log" > out/build-windows.log
          cp -r shots-win out/shots 2>/dev/null || true
          grep -iE "error|warning C4" out/build-windows.log | grep -v "0 error" | head -300 > out/errors-windows.txt || true
          cd out && git init -q && git checkout -q -b ci-logs-windows
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "windows ${{ github.sha }} ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-windows

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: axmolengine/axmol, ref: "${{ env.AXMOL_REF }}", path: axmol }
      - name: Build
        shell: bash
        run: echo y | pwsh -c "./axmol/setup.ps1; axmol build -p linux -t Cinderbound -O 3" 2>&1 | tee build-linux.log
      - name: Screenshots
        if: always()
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          BIN=$(find build* -type f -name Cinderbound -perm -u+x | head -1)
          mkdir -p shots
          if [ -n "$BIN" ]; then
            cd "$(dirname "$BIN")"
            CB_SHOTS="main_menu,starter_select,home,world_select,stage_select,tower,units,unit_detail,squad,summon,missions,inventory,profile,menu,settings,help,codex,battle,battle_party,battle@fracture_01_normal" \
            CB_SHOT_DIR="$GITHUB_WORKSPACE/shots/" timeout 300 xvfb-run -a -s "-screen 0 1080x1920x24" ./Cinderbound > "$GITHUB_WORKSPACE/shots/run.log" 2>&1 || echo "exit $?" >> "$GITHUB_WORKSPACE/shots/run.log"
          fi
      - name: Publish log
        if: always()
        run: |
          mkdir -p out && cp build-linux.log out/ 2>/dev/null || echo "no log" > out/build-linux.log
          grep -iE "error" out/build-linux.log | head -300 > out/errors-linux.txt || true
          cp -r shots out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b ci-logs-linux
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "linux ${{ github.sha }} ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-linux
